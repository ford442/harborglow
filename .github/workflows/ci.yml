name: CI

# Merge gates for HarborGlow. See AGENTS.md § "CI merge gates" for which jobs
# block merge vs report-only.
#
# Gates run in parallel jobs so smoke + production build always report even when
# unit tests fail. Job `merge-gate` aggregates results for a single required
# status check on PRs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      visual: ${{ steps.filter.outputs.visual }}
      audio: ${{ steps.filter.outputs.audio }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            visual:
              - 'src/scenes/**'
              - 'src/rendering/**'
              - 'src/shaders/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'e2e/**'
              - 'playwright.config.ts'
              - '.github/workflows/ci.yml'
            audio:
              - 'cpp/**'
              - 'public/wasm/**'
              - 'src/systems/audio/**'
              - 'src/systems/**/*SoundSystem.ts'
              - 'src/systems/audioVisualSync.ts'
              - 'src/systems/music/**'
              - 'scripts/check-wasm.mjs'
              - 'scripts/write-wasm-manifest.mjs'
              - 'e2e/audio-wasm.spec.ts'
              - 'vite.config.ts'
              - '.github/workflows/ci.yml'

  gate-lockfile:
    # Fails fast (~1 min) and with one clear signal when package-lock.json is
    # stale or a dependency's peer range no longer admits our pinned `three`.
    # Without this, a lockfile break makes every gate below fail identically
    # at "Install dependencies" after its own multi-minute timeout — which is
    # how a broken lockfile went unnoticed on main for weeks.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies (fails on lockfile drift or peer ERESOLVE)
        run: npm ci

      - name: Verify three/postprocessing peer graph
        run: npm ls three @react-three/fiber @react-three/drei @react-three/rapier

  gate-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gate-lockfile
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up pinned Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "6.0.6"
          actions-cache-folder: emsdk-cache

      - name: Rebuild committed WASM binaries
        run: npm run build:wasm

      - name: Native DSP tests
        run: make -C cpp test

      - name: Check committed WASM binaries
        run: npm run check:wasm

      - name: Reject stale generated artifacts
        run: git diff --exit-code -- public/wasm

  gate-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gate-lockfile
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check application
        run: npm run typecheck

      - name: Type-check tests
        run: npm run typecheck:tests

  gate-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gate-lockfile
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  gate-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gate-lockfile
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

  gate-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gate-lockfile
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dev-transform smoke (Babel pipeline)
        run: npm run smoke:dev-transform

  gate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gate-lockfile
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        env:
          # WASM drift is enforced by gate-wasm (rebuild + git diff). Skip a
          # second emsdk install here when the compiler is absent on this job.
          ALLOW_MISSING_EMSDK: "1"
        run: npm run build

  gate-size:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gate-lockfile
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle size budgets
        env:
          ALLOW_MISSING_EMSDK: "1"
        run: npm run typecheck && npx vite build && npm run check:bundle

  merge-gate:
    name: merge-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - gate-lockfile
      - gate-wasm
      - gate-typecheck
      - gate-lint
      - gate-test
      - gate-smoke
      - gate-build
      - gate-size
    if: always()
    steps:
      - name: Require all merge gates
        env:
          GATE_LOCKFILE: ${{ needs.gate-lockfile.result }}
          GATE_WASM: ${{ needs.gate-wasm.result }}
          GATE_TYPECHECK: ${{ needs.gate-typecheck.result }}
          GATE_LINT: ${{ needs.gate-lint.result }}
          GATE_TEST: ${{ needs.gate-test.result }}
          GATE_SMOKE: ${{ needs.gate-smoke.result }}
          GATE_BUILD: ${{ needs.gate-build.result }}
          GATE_SIZE: ${{ needs.gate-size.result }}
        run: |
          failed=0
          for label in GATE_LOCKFILE GATE_WASM GATE_TYPECHECK GATE_LINT GATE_TEST GATE_SMOKE GATE_BUILD GATE_SIZE; do
            result="${!label}"
            echo "$label: $result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more CI merge gates failed."
            exit 1
          fi
          echo "All CI merge gates passed."

  e2e-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, gate-lockfile]
    if: github.event_name == 'push' || needs.changes.outputs.visual == 'true' || needs.changes.outputs.audio == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (software WebGL)
        run: npm run test:e2e:install

      - name: Production build
        env:
          ALLOW_MISSING_EMSDK: "1"
        run: npm run build

      - name: Playwright smoke (WebGPU probe / menu)
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
