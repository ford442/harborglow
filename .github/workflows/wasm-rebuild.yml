name: WASM rebuild

# The only sanctioned producer of committed public/wasm/** binaries.
#
# gate-wasm (ci.yml) rebuilds public/wasm with a pinned emsdk and fails on any
# byte of drift, so a binary built on a developer machine — even with the same
# toolchain version string — turns main red (PR #254, 2026-09-23). Run this
# workflow against your branch instead of running `npm run build:wasm` locally
# and committing the result. It installs the emsdk release that ci.yml pins
# (read from ci.yml, never duplicated here), rebuilds, validates, and commits
# public/wasm/** back to the branch only when the bytes changed.
#
# Permissions: `contents: write` is needed for one thing — the push of the
# rebuilt binaries back to the input branch with the default GITHUB_TOKEN. It
# is scoped to this job (ci.yml keeps `contents: read` everywhere) and the
# workflow only ever runs on demand against a branch someone typed in. When
# the push is refused (protected branch, ruleset), the job does not fail: it
# uploads the rebuilt files plus a binary patch as an artifact and prints how
# to apply them.
#
# Scope: `branch` must be a branch of this repository. Branches on forks
# cannot be checked out or pushed to with this token; push the branch here
# first (or open the PR from an in-repo branch).
#
# Known limitation of the default token: a commit pushed with GITHUB_TOKEN does
# not trigger `pull_request`/`push` workflows, so CI does not run on the bot's
# commit by itself. Re-running an existing Actions run does not help either: a
# re-run reuses that run's original SHA. After this workflow has pushed, push a
# new commit to the branch (or dispatch a fresh run against it) and confirm the
# new run's head SHA is the bot commit or a descendant of it.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch of this repository to rebuild public/wasm on (fork branches are not supported); the rebuilt binaries are committed back to it"
        required: true
        type: string

concurrency:
  group: wasm-rebuild-${{ inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Push of public/wasm/** back to `inputs.branch`; see the header comment.
      contents: write
    env:
      # check:wasm's binary-drift guard rejects a public/wasm change with no
      # source change. Here the change IS the point: the bytes were just built
      # from source with the pinned toolchain, which is the stronger proof.
      ALLOW_WASM_BINARY_DRIFT: "1"
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}
          # Full history so the drift guard can find the merge base with main.
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read the emsdk pin from ci.yml
        id: pin
        run: echo "version=$(node scripts/emsdk-pin.mjs)" >> "$GITHUB_OUTPUT"

      - name: Set up pinned Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.pin.outputs.version }}
          actions-cache-folder: emsdk-cache

      - name: Rebuild WASM binaries
        run: npm run build:wasm

      - name: Native DSP tests
        run: make -C cpp test

      - name: Check rebuilt WASM binaries
        run: npm run check:wasm

      - name: Detect changes under public/wasm
        id: diff
        run: |
          if git diff --quiet -- public/wasm; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "public/wasm is already up to date with emsdk ${{ steps.pin.outputs.version }}; nothing to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- public/wasm
          fi

      - name: Commit and push rebuilt binaries
        id: push
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        env:
          BRANCH: ${{ inputs.branch }}
          EMSDK_VERSION: ${{ steps.pin.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/wasm
          git commit -m "chore(wasm): rebuild public/wasm with emsdk ${EMSDK_VERSION} (wasm-rebuild workflow)" \
            -m "Built by .github/workflows/wasm-rebuild.yml run ${GITHUB_RUN_ID} from ${GITHUB_SHA}."
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Write a binary patch of the rebuild (push refused)
        if: steps.diff.outputs.changed == 'true' && steps.push.outcome != 'success'
        # A directory upload cannot express a deleted tracked file; the patch
        # carries additions, modifications and deletions under public/wasm.
        # Diff against the dispatched head (GITHUB_SHA) rather than HEAD, since
        # the push step may already have committed locally before the push failed.
        run: |
          git diff --binary "$GITHUB_SHA" -- public/wasm > public-wasm.patch
          test -s public-wasm.patch

      - name: Upload rebuilt binaries as an artifact (push refused)
        if: steps.diff.outputs.changed == 'true' && steps.push.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: public-wasm-${{ steps.pin.outputs.version }}
          path: |
            public-wasm.patch
            public/wasm/
          if-no-files-found: error
          retention-days: 14

      - name: Explain how to apply the artifact (push refused)
        if: steps.diff.outputs.changed == 'true' && steps.push.outcome != 'success'
        env:
          BRANCH: ${{ inputs.branch }}
          EMSDK_VERSION: ${{ steps.pin.outputs.version }}
        run: |
          {
            echo "## Push to \`${BRANCH}\` was refused"
            echo
            echo "The rebuild is attached to this run as artifact \`public-wasm-${EMSDK_VERSION}\`:"
            echo "\`public-wasm.patch\` (a binary git patch that also carries deletions) plus the"
            echo "rebuilt \`public/wasm/\` files. Apply the patch on a checkout of \`${BRANCH}\` at ${GITHUB_SHA}:"
            echo
            echo '```bash'
            echo "gh run download ${GITHUB_RUN_ID} -n public-wasm-${EMSDK_VERSION} -D /tmp/public-wasm"
            echo "git apply /tmp/public-wasm/public-wasm.patch"
            echo "ALLOW_WASM_BINARY_DRIFT=1 npm run check:wasm   # these bytes were built and checked by CI; the drift guard is for local builds"
            echo "git add -A public/wasm && git commit -m 'chore(wasm): apply CI-built public/wasm (run ${GITHUB_RUN_ID})'"
            echo "git push"
            echo '```'
            echo
            echo "Do not run \`npm run build:wasm\` locally and commit its output: gate-wasm rejects bytes that differ from its own rebuild."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        env:
          BRANCH: ${{ inputs.branch }}
          EMSDK_VERSION: ${{ steps.pin.outputs.version }}
          CHANGED: ${{ steps.diff.outputs.changed }}
          PUSHED: ${{ steps.push.outputs.pushed }}
        run: |
          {
            echo "## WASM rebuild on \`${BRANCH}\`"
            echo
            echo "- emsdk pin (from ci.yml): \`${EMSDK_VERSION}\`"
            echo "- public/wasm changed: \`${CHANGED:-unknown}\`"
            echo "- pushed back to branch: \`${PUSHED:-false}\`"
          } >> "$GITHUB_STEP_SUMMARY"
